:root[data-theme="dark"]{--bg:#0f1218;--card:#181d26;--tx:#e8eaee;--mut:#98a1b0;--line:#2a313d;--p:#8fb0e6;--p2:#7f9cc9}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 40px}
.brand{font-weight:900;font-size:22px;color:var(--p);letter-spacing:.3px;margin:6px 4px 10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.tab{border:0;border-radius:12px;padding:12px 4px;font-weight:800;font-size:14px;color:#fff;cursor:pointer;opacity:.62;transition:.2s;transform:scale(.97)}
.tab.on{opacity:1;transform:scale(1.03);box-shadow:0 8px 20px #0003}
.t0{background:#2f4b7c}.t1{background:#2f6f68}.t2{background:#5a4f7c}.t3{background:#8a5a44}

@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 6px;font-size:22px}h3{margin:14px 0 6px;font-size:15px;color:var(--p)}p{line-height:1.55;margin:6px 0}.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.box{border:0;border-radius:18px;padding:16px 12px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;text-align:center;min-height:70px;transition:.15s}
.box:hover{transform:translateY(-2px)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;color:#fff;background:var(--p)}
.btn.g{background:var(--ok)}.btn.o{background:transparent;color:var(--p);border:2px solid var(--p)}.btn.r{background:var(--bad)}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,textarea{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--p)}textarea{min-height:170px;resize:vertical}
.chip{border:2px solid var(--line);background:transparent;color:var(--tx);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer}.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.word{font-size:40px;font-weight:900;text-align:center;margin:10px 0;color:var(--p);font-family:Georgia,serif}
.hint{background:#f6f1e4;color:#4a3b14;border-radius:14px;padding:12px 14px;border-left:5px solid var(--y)}
.good{background:#e4f1ea;color:#1f4d36;border-radius:14px;padding:12px 14px;border-left:5px solid var(--ok)}
.bar{position:sticky;bottom:0;background:var(--card);border-radius:18px;padding:12px;margin-top:12px;box-shadow:0 -6px 24px #5b3df522;border:1px solid var(--line)}
.pill{display:inline-block;background:var(--line);border-radius:99px;padding:4px 12px;margin:3px;font-size:14px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px;overflow:hidden;border-radius:12px;display:block;overflow-x:auto}
th{background:var(--p);color:#fff;padding:9px;text-align:left}td{padding:9px;border-bottom:1px solid var(--line)}
.ex{border-left:4px solid var(--p2);padding:4px 12px;margin:8px 0}
.err{background:#ffd6d6;color:#a61e1e;border-radius:6px;padding:1px 4px;text-decoration:underline wavy #f03e3e}
.miss{background:#fff0b3;color:#7a5a00;border-radius:6px;padding:1px 4px}
.load{text-align:center;padding:30px}.dots i{display:inline-block;width:12px;height:12px;margin:4px;border-radius:50%;background:var(--p);animation:b 1s infinite}.dots i:nth-child(2){background:var(--p2);animation-delay:.15s}.dots i:nth-child(3){background:var(--ok);animation-delay:.3s}

.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.prog b{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--y));transition:.4s}
.mic{width:64px;height:64px;border-radius:50%;font-size:26px;border:0;cursor:pointer;background:var(--p2);color:#fff}.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #5b7aa655}}
